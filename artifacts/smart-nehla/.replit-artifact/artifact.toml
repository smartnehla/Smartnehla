kind = "web"
previewPath = "/"
title = "Smart Nehla - Solution Engine"
description = "A secure full-stack control center that turns reviewed natural-language instructions into code, GitHub repositories, Supabase schema setup, and Vercel deployments with live build logs."
version = "1.0.0"
id = "artifacts/smart-nehla-solution-engine"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21548

[services.development]
run = "pnpm --filter @workspace/smart-nehla-solution-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-nehla-solution-engine", "run", "build" ]
serve = "static"
publicDir = "artifacts/smart-nehla-solution-engine/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21548"
BASE_PATH = "/"
